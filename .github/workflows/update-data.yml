name: Actualizar datos

on:
  schedule:
    # Todos los días, 4 veces al día (horas UTC ≈ 07:00, 11:00, 15:00 y 19:00 en Chile)
    - cron: "15 10,14,18,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xlrd==2.0.1
      - run: python scripts/fetch_data.py
        env:
          # Credenciales de la API del Banco Central de Chile (Settings → Secrets and variables → Actions)
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar datos $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
